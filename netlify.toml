# Netlify config for Emily Paige & Co.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Send the old Netlify address to the real domain.
# Without this, Google can treat emilypaigeco.netlify.app and
# emilypaigeandco.com as two competing copies of the same site, which
# splits the search credit between them instead of building it up on one.
# Must stay ABOVE the 404 rule: Netlify applies redirects in order.
[[redirects]]
  from = "https://emilypaigeco.netlify.app/*"
  to = "https://emilypaigeandco.com/:splat"
  status = 301
  force = true

# Serve favicon.svg when browsers request /favicon.ico.
# Every browser/scraper requests /favicon.ico by default even when we
# link /favicon.svg. This turns 46+ weekly 404s into cached 200s.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301
  force = true

# Ensure 404.html is used
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
